<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrom Pool Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrap">
      <div class="hud">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="controls">Drag and release the striker to shoot</div>
        <div class="score-box">Turns: <span id="turns">0</span></div>
      </div>

      <canvas id="gameCanvas" width="860" height="700"></canvas>
    </div>

    <script src="script.js"></script>
  </body>
</html>
